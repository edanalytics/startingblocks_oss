AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Deploys a StartingBlocks Environment (SBE).  An existing VPC is required.
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: General Information
        Parameters:
          - EnvLabel
          - HostedZoneId
          - DomainName
          - Partner
      - Label:
          default: Versions and Features
        Parameters:
          - EdFiApiVersion
          - DataStandardVersion
          - PostgresVersion
          - AdminInterface
          - DeploySwagger
          - APIPublisher
      - Label:
          default: Deployment Files
        Parameters:
          - S3SourceBucket
          - ArtifactsS3SourceBucket
          - WebApiZipFile
          - DatabaseArtifact
      - Label:
          default: Ed-Fi Options
        Parameters:
          - EdFiTenancyMode
          - DatabaseData
          - BearerTokenPerClientLimit
      - Label:
          default: Capacity and Scaling
        Parameters:
          - EnvironmentSize
          - WebAPIMinInstances
          - WebAPIMaxInstances
          - SpotFleetPercentage
          - DatabaseType
          - DeployReplica
          - WebAPIMaxPoolSize
          - WebAPIConnectionIdleLifetime
      - Label:
          default: Security Options
        Parameters:
          - SSLPolicy
          - AdminApiCIDRs
          - AdminAccountIds
          - WebACLArn
          - SSHServerParentStack
      - Label:
          default: Monitoring and Alerting
        Parameters:
          - S3AccessLogBucket
          - SNSTopicArn
          - SlackWebhookUrl
      - Label:
          default: Maintenance Options
        Parameters:
          - DeploymentStrategy
          - BeanstalkPlatformUpdateTime  
      - Label:
          default: VPC Network Configuration
        Parameters:
          - VpcId
          - PublicSubnet1Id
          - PublicSubnet2Id
          - PrivateSubnet1Id
          - PrivateSubnet2Id

    ParameterLabels:
      S3SourceBucket:
        default: S3 Bucket name containing this template
      ArtifactsS3SourceBucket: 
        default: Artifact source
      VpcId:
        default: VPC ID
      PublicSubnet1Id:
        default: Public Subnet 1 ID
      PublicSubnet2Id:
        default: Public Subnet 2 ID
      PrivateSubnet1Id:
        default: Private Subnet 1 ID
      PrivateSubnet2Id:
        default: Private Subnet 2 ID
      DeploymentStrategy:
        default: Update/Deployment Strategy
      WebAPIMinInstances:
        default: Minimum Web API Instances
      WebAPIMaxInstances:
        default: Maximum Web API Instances
      SpotFleetPercentage:
        default: Percentage of On-Demand Instances
      WebAPIMaxPoolSize:
        default: Database connection pool size
      WebAPIConnectionIdleLifetime:
        default: Connection Idle Lifetime
      WebACLArn:
        default: WebACL ARN
      DatabaseData:
        default: Initial ODS API Database Data Set
      DataStandardVersion:
        default: Data Standard Version
      EdFiApiVersion:
        default: Ed-Fi API Version
      DeployReplica:
        default: Deploy Read Replica
      PostgresVersion:
        default: PostgreSQL Version
      EdFiTenancyMode:
        default: Ed-Fi Tenancy Mode
      WebApiZipFile:
        default: Elastic Beanstalk zip file for Ed-Fi WebApi
      DatabaseArtifact:
        default: Database Artifact
      EnvironmentSize:
        default: Select a sizing option based on anticipated levels of usage
      EnvLabel:
        default: Label your environment
      SSHServerParentStack:
        default: SSH server stack
      DatabaseType:
        default: Aurora compute capacity mode
      APIPublisher:
        default: API Publisher Support
      AdminApiCIDRs:
        default: Admin Api allowed CIDR ranges
      AdminAccountIds:
        default: AWS Account ID's allowed to invoke admin Lambda functions
      AdminInterface:
        default: Admin Interface
      DomainName:
        default: Domain Name
      HostedZoneId:
        default: Route53 zone
      Partner:
        default: Partner name
      SSLPolicy:
        default: SSL Policy
      SNSTopicArn:
        default: SNS topic
      DeploySwagger:
        default: Deploy Swagger UI
      SlackWebhookUrl:
        default: Slack webhook URL
      S3AccessLogBucket:
        default: S3 bucket for ELB Access Logs
      BeanstalkPlatformUpdateTime: 
        default: Elastic Beanstalk automatic platform update schedule
      BearerTokenPerClientLimit:
        default: Bearer Token Per Client Limit
Parameters:
  S3SourceBucket:
    Type: String
    Description: This bucket contains the source files for CloudFormation and Lambda layers.  MUST be in the same region as the CF Stack.
  ArtifactsS3SourceBucket:
    Type: String
    Description: EA provides a central artifact store for standard Ed-Fi deployments.  If you use extensions or wish to customize the deployment in another way, you must place your artifacts in the database/ and docker/ folders in the S3 bucket named above. 
    AllowedValues: 
      - Use artifacts from EA's central artifact store
      - Use my own custom artifacts in the CloudFormation bucket
  EnvironmentSize:
    AllowedValues:
      - small
      - medium
      - large
      - xlarge
      - 2xlarge
      - 4xlarge
      - 8xlarge
    Default: small
    Description: Select the size of the environment to launch.  Smaller is cheaper but less performant. 
    Type: String
  WebApiZipFile:
    Default: 'default'
    Description: If using a custom Ed-Fi build, provide the zip file name here.  Use 'default' to deploy the stock Ed-Fi build for the chosen Ed-Fi API and DataStandard versions.
    Type: String
  DatabaseArtifact:
    Default: 'default'
    Description: If using custom databases, provide the database artifact name here.  Use 'default' to deploy stock Ed-Fi databases for the chosen Ed-Fi API and DataStandard versions.  Do not change this parameter after initial stack deployment.
    Type: String
  EnvLabel:
    Description: Provide a unique label for your environment to identify resources.  You cannot use a label that is already in use.
    Type: String
  DomainName:
    Description: The fully qualified domain name to be used for this ODS
      API environment. (e.g. edfi.domain.com)  MUST be part of the Route53 Hosted Zone.
    Type: String
  HostedZoneId:
    Description: A Route53 HostedZone is required.  Select the zone for this environment.
    Type: AWS::Route53::HostedZone::Id
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: The VPC ID to use.
    ConstraintDescription: You must select an existing VPC for this deployment
  PublicSubnet1Id:
    Type: AWS::EC2::Subnet::Id
    Description: The Subnet ID of a Public Subnet in one of the Availability Zones above
    ConstraintDescription: You must select an existing Public Subnet ID in the VPC selected for this deployment
  PublicSubnet2Id:
    Type: AWS::EC2::Subnet::Id
    Description: The Subnet ID of a Public Subnet in the other Availability Zone above
    ConstraintDescription: You must select an existing Public Subnet ID in the VPC selected for this deployment
  PrivateSubnet1Id:
    Type: AWS::EC2::Subnet::Id
    Description: The Subnet ID of a Private Subnet in one of the Availability Zones above
    ConstraintDescription: You must select an existing Private Subnet ID in the VPC selected for this deployment
  PrivateSubnet2Id:
    Type: AWS::EC2::Subnet::Id
    Description: The Subnet ID of a Private Subnet in the other Availability Zone above
    ConstraintDescription: You must select an existing Private Subnet ID in the VPC selected for this deployment
  SSHServerParentStack:
    Description: Stack name for the existing SSH server parent stack based on EA's standard SSH server template. (optional)
    Type: String
  APIPublisher:
    AllowedValues:
      - 'true'
      - 'false'
    Default: 'false'
    Description: Deploys resources to enable the 'snapshot' ODS derivative type, and fix ChangeVersions in cloned databases. 
    Type: String
  AdminApiCIDRs:
    AllowedPattern: '^$|^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/([0-9]|[1-2][0-9]|3[0-2]))(,(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/([0-9]|[1-2][0-9]|3[0-2])))*$'
    Description: |
      For security reasons we recommend that you only enable trusted IPs for external access to the Admin Api.  
      This should be a comma separated list of trusted networks in CIDR notation (X.X.X.X/X). 
      The StartingBlocks Admin App IP's, and the Education Analytics office IP range are as follows.
      (18.119.27.161/32,3.135.55.248/32,172.102.6.120/29). (optional)
    Type: String
  AdminInterface:
    Description: The interface that will provide management functions for this environment.
    Type: String
    Default: "Ed-Fi Admin API"
    AllowedValues:
      - "Ed-Fi Admin API"
      - "None"
  AdminAccountIds:
    Description: | 
      When using StartingBlocks Admin App, these (comma separated) AWS Account ID's will be given permission to invoke the management Lambda Functions.
      Account ID 179685256884 will allow the Education Analytics StartingBlocks Admin App. (optional)
    Type: String
    AllowedPattern: '^$|^[0-9]{12}(,[0-9]{12})*$'
  EdFiTenancyMode:
    Description: The tenancy mode that Ed-Fi will run in.  Note that 'SingleTenant' is not compatible with StartingBlocks Admin App.
    AllowedValues:
      - 'SingleTenant'
      - 'MultiTenant'
    Default: 'MultiTenant'
    Type: String
  PostgresVersion:
    Description: Ed-Fi Alliance officially supports Postgres 16 with Ed-Fi 7.x
    Type: String
    AllowedValues:
      - 'Fifteen'
      - 'Sixteen'
    Default: 'Sixteen'
  DatabaseType:
    Description: |
      Provisioned capacity provides a database server of fixed size, and does not auto-scale.  Provisioned capacity is cheaper for development environments, and may be eligible for some AWS savings plans.
      Serverless mode allows for rapid auto scaling of the database compute.  Serverless mode is often more expensive, but can provide improved performance in unpredictable production environments.
    Type: String
    Default: "Provisioned"
    AllowedValues:
      - "Provisioned"
      - "Serverless"
  DatabaseData:
    Description: For SingleTenant deployments, pick the template that will be used to create the default ODS.  For MultiTenant deployments, a default ODS is not created in CloudFormation and both templates are imported for later use.
    Type: String
    Default: minimal
    AllowedValues:
      - minimal
      - populated
  DataStandardVersion:
    Type: String
    Default: DS4
    Description: Which version of the Ed-Fi Data Standard should be deployed.  This can NOT be changed later.
    AllowedValues:
      - DS4
      - DS5
      - DS5.1
      - DS5.2
  EdFiApiVersion:
    Type: String
    Description: Which version of the Ed-Fi API should be deployed.  This can NOT be changed later.
    Default: "7.1"
    AllowedValues:
      - "7.1"
      - "7.2"
      - "7.3"
  DeployReplica:
    AllowedValues:
      - 'true'
      - 'false'
    Default: 'false'
    Description: This will double the cost of the database, but should improve read performance and provide faster failover.
    Type: String
  DeploymentStrategy:
    Type: String
    Description: |
      RollingWithAdditionalBatch will deploy new code and platform updates by adding new servers one at a time.  This option avoids downtime and is recommended for production deployments.
      AllAtOnce will deploy new code and platform updates to every server at the same time.  This option is faster but the environment will be unavailable until the deployment is complete.
    AllowedValues:
      - 'RollingWithAdditionalBatch'
      - 'AllAtOnce'
    Default: 'RollingWithAdditionalBatch'
  BeanstalkPlatformUpdateTime:
    Description: Specify the update day and time in UTC using the format 'Day:HH:MM' (e.g., Wed:15:30). Platform updates will be disabled if no value is specified. (optional)
    Type: String
    AllowedPattern: '^$|^(Mon|Tue|Wed|Thu|Fri|Sat|Sun):(0[0-9]|1[0-9]|2[0-3]):[0-5][0-9]$'
    Default: "Wed:15:30"
  WebAPIMinInstances:
    Type: Number
    Description: Minimum number of Ed-Fi Web API servers.  There will always be this number of servers available.
    Default: 1
  WebAPIMaxInstances:
    Type: Number
    Description: Maximum number of Ed-Fi Web API servers.  The environment will scale up 1 instance at a time up to this limit.
    Default: 3
  SpotFleetPercentage:
    Type: Number
    Description: While scaling up, the next 2 Ed-Fi Web API servers will be On-Demand.  After that, this percentage will also be On-Demand and the remaining will be Spot Instances.
    Default: 70
  WebAPIMaxPoolSize:
    Type: Number
    Description: Each Ed-Fi Web Api server will be able to make this many connections to each ODS database.
    Default: 200
  WebAPIConnectionIdleLifetime:
    Type: Number
    Description: Connection idle lifetime (seconds) for connections to the Ed-Fi ODS database.
    Default: 120
  WebACLArn:
    Type: String
    Description: Provide the ARN of a WAF to attach to the Web API (optional)
  Partner:
    Type: String
    Description: Enter the acronym for the organization using this environment.  Used for additional uniqueness in S3 bucket names, and additional context in alerts.
    Default: 'ea'
  SSLPolicy:
    Description: Policy to determine which ssl/tls ciphers are accepted. Aeries Districts use ELBSecurityPolicy-TLS13-1-2-2021-06.
    Type: String
    AllowedValues:
      - 'ELBSecurityPolicy-TLS13-1-2-2021-06'
      - 'ELBSecurityPolicy-TLS13-1-2-Res-2021-06'
    Default: 'ELBSecurityPolicy-TLS13-1-2-Res-2021-06'
  SNSTopicArn:
    Description: ARN of SNS topic to publish Route53 HealthCheck Alarms (optional)
    Type: String
  DeploySwagger:
    Type: String
    Description: If enabled, Swagger UI will be deployed to swagger-ui.{DomainName}
    AllowedValues:
      - 'True'
      - 'False'
    Default: 'False'
  SlackWebhookUrl:
    Type: String
    Description: The URL of the Slack webhook to send notifications to (optional).
  S3AccessLogBucket:
    Type: String
    Description: Name of S3 bucket to store access logs for ELB.  Must be in the same region as the CF Stack. (optional)
  BearerTokenPerClientLimit:
    Type: Number
    Description: The maximum number of bearer tokens that can be issued to a single client in 30 minutes. (Version 7.3+)
    Default: 15
Mappings: 
  PostgreSQLInformation:
    EngineVersion:
      "Thirteen": "13.18"
      "Fourteen": "14.15"
      "Fifteen": "15.10"
      "Sixteen": "16.6"
    EngineEdition:
      "Standard": "postgres"
    AccountInfo: 
      "DBUsername": "postgres"
    DBSize:
      "small": "db.t4g.medium"
      "medium": "db.t4g.large"
      "large": "db.r6g.large"
      "xlarge": "db.r6g.xlarge"
      "2xlarge": "db.r6g.2xlarge"
      "4xlarge": "db.r7g.4xlarge"
      "8xlarge": "db.r7g.8xlarge"
    MinServerlessCapacity:
      "small": 0.5
      "medium": 1
      "large": 2
      "xlarge": 4
      "2xlarge": 8
      "4xlarge": 16
      "8xlarge": 32
    MaxServerlessCapacity:
      "small": 3
      "medium": 6
      "large": 12
      "xlarge": 24
      "2xlarge": 48
      "4xlarge": 96
      "8xlarge": 192
    AppServerSize:
      "small": "t3a.medium,t3.medium"
      "medium": "t3.large,t3a.large"
      "large": "t3.large,t3a.large"
      "xlarge": "m7a.large,m7i.large,m6a.large,m6i.large"
      "2xlarge": "c7a.xlarge,m7a.xlarge,c7i.xlarge,m7i.xlarge"
      "4xlarge": "c7a.2xlarge,m7a.2xlarge,c7i.2xlarge,m7i.2xlarge"
      "8xlarge": "c7a.2xlarge,m7a.2xlarge,c7i.2xlarge,m7i.2xlarge"
    AdminServerSize:
      "small": "t3a.small,t3.small"
      "medium": "t3a.small,t3.small"
      "large": "t3a.small,t3.small"
      "xlarge": "t3a.medium,t3.medium"
      "2xlarge": "t3a.medium,t3.medium"
      "4xlarge": "t3a.medium,t3.medium"
      "8xlarge": "t3a.medium,t3.medium"
  EdFiApiVersionPatch: 
    "7.1":
      "Patch": "6238" # Patch 4
    "7.2":
      "Patch": "6237" # Patch 2
    "7.3":
      "Patch": "6252" # Patch 1
Conditions:
  UsePopulatedData: !Equals
    - !Ref 'DatabaseData'
    - populated
  UseAdminApi: !Equals [!Ref 'AdminInterface', "Ed-Fi Admin API"]
  UseDefaultWebApiZip: !Equals 
    - !Ref WebApiZipFile
    - 'default'
  EnableHealthCheck:
    !Not [!Equals [!Ref SNSTopicArn, '']]
  UseDefaultDatabase: !Equals 
    - !Ref DatabaseArtifact
    - 'default'
  UsePublisher: !Equals [!Ref APIPublisher, 'true']
  DeploySwaggerTemplate: !Equals
    - !Ref 'DeploySwagger'
    - 'True'
  EnableSlackNotifications: !Not [!Equals [!Ref SlackWebhookUrl, '']]
  UseDefaultArtifactsS3Bucket: !Equals
    - !Ref ArtifactsS3SourceBucket
    - "Use artifacts from EA's central artifact store"
Rules:
  SubnetsInVPC:
    Assertions:
      - Assert: !EachMemberIn
          - !ValueOfAll
            - AWS::EC2::Subnet::Id
            - VpcId
          - !RefAll 'AWS::EC2::VPC::Id'
        AssertDescription: All subnets provided must be in the VPC selected for use
  EdFiApiVersionToDataStandard:
    Assertions:
      - Assert: !Or
          - !And 
            - !Equals [!Ref EdFiApiVersion, "7.1"]
            - !Or
              - !Equals [!Ref DataStandardVersion, "DS4"]
              - !Equals [!Ref DataStandardVersion, "DS5"]
          - !And 
            - !Equals [!Ref EdFiApiVersion, "7.2"]
            - !Or
              - !Equals [!Ref DataStandardVersion, "DS4"]
              - !Equals [!Ref DataStandardVersion, "DS5.1"]
          - !And 
            - !Equals [!Ref EdFiApiVersion, "7.3"]
            - !Or
              - !Equals [!Ref DataStandardVersion, "DS4"]
              - !Equals [!Ref DataStandardVersion, "DS5.2"]
        AssertDescription: DataStandardVersion must be compatible with Ed-Fi API version selected.

Resources:
  # Shared Resources stack deploys IAM, KMS, Security Groups, Secrets, Certificate, ALB, DynamoDB and Route53 resources
  SharedResourcesStack:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub 'https://${S3SourceBucket}.s3.amazonaws.com/templates/x-shared-resources.yml'
      Parameters:
        VpcId: !Ref 'VpcId'
        EnvLabel: !Ref 'EnvLabel'
        AdminInterface: !Ref AdminInterface
        AdminApiCIDRs: !Ref AdminApiCIDRs
        SSHServerParentStack: !Ref SSHServerParentStack
        WebACLArn: !Ref 'WebACLArn'
        PublicSubnet1Id: !Ref 'PublicSubnet1Id'
        PublicSubnet2Id: !Ref 'PublicSubnet2Id'
        DomainName: !Ref 'DomainName'
        HostedZoneId: !Ref 'HostedZoneId'
        SSLPolicy: !Ref SSLPolicy
        S3AccessLogBucket: !Ref S3AccessLogBucket

  LambdaCoreStack:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub 'https://${S3SourceBucket}.s3.amazonaws.com/templates/x-lambda-core-functions.yml'
      Parameters:
        AdminInterface: !Ref AdminInterface
        AdminAccountIds: !Ref AdminAccountIds
        S3BucketSourceCode: !Ref 'S3SourceBucket'
        ArtifactsS3SourceBucket: !If 
          - UseDefaultArtifactsS3Bucket
          - !Sub 'startingblocks-edfi-artifacts-${AWS::Region}'
          - !Ref 'S3SourceBucket'
        S3KeySourceCode: lambdas
        PrivateSubnet1Id: !Ref 'PrivateSubnet1Id'
        PrivateSubnet2Id: !Ref 'PrivateSubnet2Id'
        LambdaRestoreSGID: !GetAtt 'SharedResourcesStack.Outputs.DatabaseRestoreLambdaFunctionSGID'
        LambdaDefaultSGID: !GetAtt 'SharedResourcesStack.Outputs.LambdaDefaultSGID'
        EnvLabel: !Ref 'EnvLabel'
        RDSSecret: !GetAtt 'SharedResourcesStack.Outputs.AuroraMasterSecret'
        Partner: !Ref 'Partner'
        EdFiTenancyMode: !Ref EdFiTenancyMode
        DomainName: !Ref DomainName
        WebAPIMaxPoolSize: !Ref WebAPIMaxPoolSize
        WebAPIConnectionIdleLifetime: !Ref WebAPIConnectionIdleLifetime
        DeployReplica: !Ref DeployReplica
        APIPublisher: !Ref APIPublisher
        SNSTopicArn: !Ref SNSTopicArn
        SlackWebhookUrl: !Ref SlackWebhookUrl
        KmsKeyId: !GetAtt 'SharedResourcesStack.Outputs.KeyId'
        DeploySwagger: !Ref 'DeploySwagger'
        
  DatabaseStack:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub 'https://${S3SourceBucket}.s3.amazonaws.com/templates/x-aurora-postgres-db.yml'
      Parameters:
        EnvLabel: !Ref 'EnvLabel'
        DBUsername: !FindInMap
          - PostgreSQLInformation
          - AccountInfo
          - DBUsername
        DBEngineVersion: !FindInMap
          - PostgreSQLInformation
          - EngineVersion
          - !Ref PostgresVersion
        DBInstanceClass: !FindInMap
          - PostgreSQLInformation
          - DBSize
          - !Ref EnvironmentSize
        DatabaseType: !Ref 'DatabaseType'
        ServerlessMinCapacity: !FindInMap
          - PostgreSQLInformation
          - MinServerlessCapacity
          - !Ref EnvironmentSize
        ServerlessMaxCapacity: !FindInMap
          - PostgreSQLInformation
          - MaxServerlessCapacity
          - !Ref EnvironmentSize
        PrivateSubnet1Id: !Ref 'PrivateSubnet1Id'
        PrivateSubnet2Id: !Ref 'PrivateSubnet2Id'
        RDSSecurityGroupID: !GetAtt 'SharedResourcesStack.Outputs.RDSSecurityGroupID'
        DeployReplica: !Ref DeployReplica
        KmsKeyId: !GetAtt 'SharedResourcesStack.Outputs.KeyId'
        RDSSecret: !GetAtt 'SharedResourcesStack.Outputs.AuroraMasterSecret'
        SnsToSlackLambdaArn: !If
          - EnableSlackNotifications
          - !GetAtt 'LambdaCoreStack.Outputs.SnsToSlackLambdaArn'
          - ''
        CWRetentionLambdaArn: !GetAtt 'LambdaCoreStack.Outputs.SetCloudWatchRetentionFunctionArn'

  LambdaRDSRestoreStack:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    DependsOn: 
      - DatabaseStack
    Properties:
      TemplateURL: !Sub 'https://${S3SourceBucket}.s3.amazonaws.com/templates/x-restore-databases.yml'
      Parameters:
        RDSSecret: !GetAtt 'SharedResourcesStack.Outputs.AuroraMasterSecret'
        RestoreMinimalDB: !If [UsePopulatedData, 'no', 'yes']
        RestorePopulatedDB: !If [UsePopulatedData, 'yes', 'no']
        EdFiTenancyMode: !Ref EdFiTenancyMode
        S3SourceBucket: !If 
          - UseDefaultArtifactsS3Bucket
          - !Sub 'startingblocks-edfi-artifacts-${AWS::Region}'
          - !Ref 'S3SourceBucket'
        S3SourceKeyName: 'database'
        AdminDbS3Name: !If 
          - UseDefaultDatabase
          - !Sub 'EdFi_Admin_${EdFiApiVersion}_${DataStandardVersion}'
          - !Sub 'EdFi_Admin_${DatabaseArtifact}'
        AdminApiDbS3Name: 'EdFi_Admin_Api_2.2'
        SecurityDbS3Name: !If 
          - UseDefaultDatabase
          - !Sub 'EdFi_Security_${EdFiApiVersion}_${DataStandardVersion}'
          - !Sub 'EdFi_Security_${DatabaseArtifact}'
        MinimalDbS3Name: !If 
          - UseDefaultDatabase
          - !Sub 'EdFi_Ods_Minimal_Template_TPDM_Core_${EdFiApiVersion}_${DataStandardVersion}'
          - !Sub 'EdFi_Ods_Minimal_Template_${DatabaseArtifact}'
        PopulatedDbS3Name: !If 
          - UseDefaultDatabase
          - !Sub 'EdFi_Ods_Populated_Template_TPDM_Core_${EdFiApiVersion}_${DataStandardVersion}'
          - !Sub 'EdFi_Ods_Populated_Template_${DatabaseArtifact}'
        LambdaFunctionName: !GetAtt 'LambdaCoreStack.Outputs.DatabaseRestoreLambdaFunctionName'
        DeployReplica: !Ref DeployReplica
        ODSDerivativesLambdaArn: !GetAtt 'LambdaCoreStack.Outputs.ODSDerivativesLambdaArn'
        APIPublisher: !Ref APIPublisher

  WebApiBeanstalkStack:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    DependsOn: LambdaRDSRestoreStack
    Properties:
      TemplateURL: !Sub 'https://${S3SourceBucket}.s3.amazonaws.com/templates/x-beanstalk-web-api.yml'
      Parameters:
        WebAPIMinInstances: !Ref 'WebAPIMinInstances'
        WebAPIMaxInstances: !Ref 'WebAPIMaxInstances'
        SpotFleetPercentage: !Ref 'SpotFleetPercentage'
        EnvLabel: !Ref 'EnvLabel'
        VpcId: !Ref 'VpcId'
        PrivateSubnet1Id: !Ref 'PrivateSubnet1Id'
        PrivateSubnet2Id: !Ref 'PrivateSubnet2Id'
        EC2SecurityGroup: !GetAtt 'SharedResourcesStack.Outputs.WebApiServerSecurityGroupID'
        S3BucketName: !If 
          - UseDefaultArtifactsS3Bucket
          - !Sub 'startingblocks-edfi-artifacts-${AWS::Region}'
          - !Ref 'S3SourceBucket'
        InstanceTypes: !FindInMap
          - PostgreSQLInformation
          - AppServerSize
          - !Ref EnvironmentSize
        BeanstalkServiceRole: !GetAtt 'SharedResourcesStack.Outputs.ElasticBeanstalkServiceRoleName'
        IamInstanceProfile: !GetAtt 'SharedResourcesStack.Outputs.ElasticBeanstalkEC2InstanceProfileName'
        RDSSecret: !GetAtt 'SharedResourcesStack.Outputs.AuroraMasterSecret'
        EdFiTenancyMode: !Ref 'EdFiTenancyMode'
        WebApiZipFile: !If
          - UseDefaultWebApiZip
          - !Sub
              - "WebApi-${EdFiApiVersion}.${PatchVersion}-${DataStandardVersion}.zip"
              - { PatchVersion: !FindInMap [EdFiApiVersionPatch, !Ref EdFiApiVersion, Patch] }
          - !Ref 'WebApiZipFile'
        SnsToSlackLambdaArn: !If
          - EnableSlackNotifications
          - !GetAtt 'LambdaCoreStack.Outputs.SnsToSlackLambdaArn'
          - ''
        KmsKeyId: !GetAtt 'SharedResourcesStack.Outputs.KeyId'
        DomainName: !Ref 'DomainName'
        AccessRestriction: '*.DomainName'
        DeploymentStrategy: !Ref DeploymentStrategy
        BeanstalkPlatformUpdateTime: !Ref BeanstalkPlatformUpdateTime
        WebAPIMaxPoolSize: !Ref WebAPIMaxPoolSize
        WebAPIConnectionIdleLifetime: !Ref WebAPIConnectionIdleLifetime
        SharedAlbArn: !GetAtt 'SharedResourcesStack.Outputs.SharedAlbArn'
        SharedAlbHTTPSListenerArn: !GetAtt 'SharedResourcesStack.Outputs.SharedAlbHTTPSListenerArn'
        SNSTopicArn: !Ref SNSTopicArn
        East1AlarmLambdaArn: !If [EnableHealthCheck, !GetAtt 'LambdaCoreStack.Outputs.East1AlarmLambdaArn', '']
        UploadAndDeployArn: !GetAtt 'LambdaCoreStack.Outputs.BeanstalkUploadAndDeployFunctionArn'
        Partner: !Ref 'Partner'
        BearerTokenPerClientLimit: !Ref BearerTokenPerClientLimit

  AdminApiStack:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Condition: UseAdminApi
    DependsOn: LambdaRDSRestoreStack
    Properties:
      TemplateURL: !Sub 'https://${S3SourceBucket}.s3.amazonaws.com/templates/x-beanstalk-admin-api.yml'
      Parameters:
        EnvLabel: !Ref 'EnvLabel'
        PrivateSubnet1Id: !Ref 'PrivateSubnet1Id'
        PrivateSubnet2Id: !Ref 'PrivateSubnet2Id'
        VpcId: !Ref 'VpcId'
        InstanceTypes: !FindInMap
          - PostgreSQLInformation
          - AdminServerSize
          - !Ref EnvironmentSize
        BeanstalkServiceRole: !GetAtt 'SharedResourcesStack.Outputs.ElasticBeanstalkServiceRoleName'
        EC2SecurityGroup: !GetAtt 'SharedResourcesStack.Outputs.AdminApiServerSecurityGroupID'
        IamInstanceProfile: !GetAtt 'SharedResourcesStack.Outputs.ElasticBeanstalkEC2InstanceProfileName'
        RDSSecret: !GetAtt 'SharedResourcesStack.Outputs.AuroraMasterSecret'
        DomainName: !Ref 'DomainName'
        S3BucketName: !If 
          - UseDefaultArtifactsS3Bucket
          - !Sub 'startingblocks-edfi-artifacts-${AWS::Region}'
          - !Ref 'S3SourceBucket'
        EdFiTenancyMode: !Ref 'EdFiTenancyMode'
        DeploymentStrategy: !Ref DeploymentStrategy
        BeanstalkPlatformUpdateTime: !Ref BeanstalkPlatformUpdateTime
        UploadAndDeployArn: !GetAtt 'LambdaCoreStack.Outputs.BeanstalkUploadAndDeployFunctionArn'
        SharedAlbArn: !GetAtt 'SharedResourcesStack.Outputs.SharedAlbArn'
        SharedAlbAdminApiListenerArn: !GetAtt 'SharedResourcesStack.Outputs.SharedAlbAdminApiListenerArn'

  CloudWatchDashboardStack:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub 'https://${S3SourceBucket}.s3.amazonaws.com/templates/x-cloudwatch-dashboard.yml'
      Parameters:
        EnvLabel: !Ref 'EnvLabel'
        DBClusterIdentifier: !GetAtt 'DatabaseStack.Outputs.DBClusterIdentifier'
        BeanstalkEnvName: !GetAtt 'WebApiBeanstalkStack.Outputs.EnvironmentName'
        DomainName: !Ref 'DomainName'
        DatabaseType: !Ref DatabaseType
        SharedAlbArn: !GetAtt 'SharedResourcesStack.Outputs.SharedAlbArn'
        TargetGroupArn: !GetAtt 'WebApiBeanstalkStack.Outputs.TargetGroupArn'

  SwaggerStack:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Condition: DeploySwaggerTemplate
    Properties:
      TemplateURL: !Sub 'https://${S3SourceBucket}.s3.amazonaws.com/templates/x-swagger.yml'
      Parameters:
        EnvLabel: !Ref 'EnvLabel'
        HostedZoneId: !Ref 'HostedZoneId'
        S3SourceBucket: !Ref 'S3SourceBucket'
        DomainName: !Ref 'DomainName'
        SwaggerDefaultURL:  !If 
          - UseDefaultWebApiZip
          - !Sub 'https://api.ed-fi.org/v${EdFiApiVersion}/api/metadata/data/v3/resources/swagger.json'
          - ''
        CRHelperLambdaLayer: !GetAtt 'LambdaCoreStack.Outputs.CRHelperLambdaLayer'
        Partner: !Ref 'Partner'
        LambdaDefaultSGID: !GetAtt 'SharedResourcesStack.Outputs.LambdaDefaultSGID'
        PrivateSubnet1Id: !Ref 'PrivateSubnet1Id'
        PrivateSubnet2Id: !Ref 'PrivateSubnet2Id'
        KmsKeyId: !GetAtt 'SharedResourcesStack.Outputs.KeyId'

  StateMachineStack:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub 'https://${S3SourceBucket}.s3.amazonaws.com/templates/x-state-machines.yml'
      Parameters:
        EnvLabel: !Ref 'EnvLabel'
        QueryRunnerLambdaArn: !GetAtt 'LambdaCoreStack.Outputs.QueryRunnerLambdaArn'

Outputs:
  WebApiDnsName:
    Description: The DNS name of the ODS API suite that you should use to create a
      CNAME/ALIAS DNS record to point to your own Domain e.g. mysite.com
    Value: !GetAtt 'WebApiBeanstalkStack.Outputs.EndpointURL'
  WebApiProdURL:
    Description: The URL of the ODS/API endpoint, after DNS is updated
    Value: !Sub 'https://${DomainName}'
  AdminApiProdURL:
    Condition: UseAdminApi
    Description: The URL of the Admin Api.
    Value: !Sub 'https://adminapi.${DomainName}'
  SBEMetadataLambdaArn:
    Condition: UseAdminApi
    Description: Lambda ARN for SBE Meatadata Function
    Value: !GetAtt 'LambdaCoreStack.Outputs.SBEMetadataLambdaArn'
  ChangeVersionLambdaArn:
    Condition: UsePublisher
    Description: Lambda ARN for ChangeVersion Function
    Value: !GetAtt 'LambdaCoreStack.Outputs.ChangeVersionLambdaArn'
    Export:
      Name: !Sub '${AWS::StackName}-ChangeVersionLambdaArn'
  DatabaseEndpoint:
    Description: The ODS API Database endpoint
    Value: !GetAtt 'DatabaseStack.Outputs.RDSSQLEndpoint'
    Export:
      Name: !Sub '${AWS::StackName}-DatabaseEndpoint'
  DatabaseSecurityGroup:
    Description: The ODS API Database Security Group
    Value: !GetAtt 'SharedResourcesStack.Outputs.RDSSecurityGroupID'
    Export:
      Name: !Sub '${AWS::StackName}-DatabaseSecurityGroup'
  DatabaseSubnetGroup:
    Description: The ODS API Database Subnet Group
    Value: !GetAtt 'DatabaseStack.Outputs.DBSubnetGroup'
    Export:
      Name: !Sub '${AWS::StackName}-DBSubnetGroup'
  KmsKeyId:
    Description: KMS Key ID.
    Value: !GetAtt 'SharedResourcesStack.Outputs.KeyId'
    Export:
      Name: !Sub '${AWS::StackName}-KmsKeyId'
  LambdaRestoreSgId:
    Description: Security Group ID for Lambda Restore RDS function.
    Value: !GetAtt 'SharedResourcesStack.Outputs.DatabaseRestoreLambdaFunctionSGID'
    Export:
      Name: !Sub '${AWS::StackName}-LambdaRestoreSgId'
  VpcId:
    Description: VPC Chosen for Starting Blocks Env.
    Value: !Ref 'VpcId'
    Export:
      Name: !Sub '${AWS::StackName}-VpcId'
  PrivateSubnet1Id:
    Description: Private subnet 1 for Starting Blocks Env.
    Value: !Ref 'PrivateSubnet1Id'
    Export:
      Name: !Sub '${AWS::StackName}-PrivateSubnet1Id'
  PrivateSubnet2Id:
    Description: Private subnet 2 for Starting Blocks Env.
    Value: !Ref 'PrivateSubnet2Id'
    Export:
      Name: !Sub '${AWS::StackName}-PrivateSubnet2Id'
  PublicSubnet1Id:
    Description: Public subnet 1 for Starting Blocks Env.
    Value: !Ref 'PublicSubnet1Id'
    Export:
      Name: !Sub '${AWS::StackName}-PublicSubnet1Id'
  PublicSubnet2Id:
    Description: Public subnet 2 for Starting Blocks Env.
    Value: !Ref 'PublicSubnet2Id'
    Export:
      Name: !Sub '${AWS::StackName}-PublicSubnet2Id'
  EnvLabel:
    Description: Name of Starting Blocks Environment.
    Value: !Ref 'EnvLabel'
    Export:
      Name: !Sub '${AWS::StackName}-EnvLabel'
  Partner:
    Description: Name of Partner of Starting Blocks Environment.
    Value: !Ref 'Partner'
    Export:
      Name: !Sub '${AWS::StackName}-Partner'
  DomainName:
    Description: Domain Name of Starting Blocks Environment.
    Value: !Ref 'DomainName'
    Export:
      Name: !Sub '${AWS::StackName}-DomainName'
  HostedZoneId:
    Description: Route53 Hosted Zone Id containing the DNS records for the DomainName.
    Value: !Ref 'HostedZoneId'
    Export:
      Name: !Sub '${AWS::StackName}-HostedZoneId'
  WildcardCertificateArn:
    Description: ARN of the Wildcard SSL certificate generated for this environment.
    Value: !GetAtt 'SharedResourcesStack.Outputs.WildcardCertificateArn'
    Export:
      Name: !Sub '${AWS::StackName}-WildcardCertificateArn'
  RdsSecretArn:
    Description: Arn of the RDS Secret in Secrets Manager for this environment.
    Value: !GetAtt 'SharedResourcesStack.Outputs.AuroraMasterSecret'
    Export:
      Name: !Sub '${AWS::StackName}-RdsSecretArn'
  EdFiTenancyMode:
    Description: EdFi tenancy mode configured for this environment.
    Value: !Ref EdFiTenancyMode
    Export:
      Name: !Sub '${AWS::StackName}-EdFiTenancyMode'
  S3SourceBucket:
    Description: Name of S3 bucket containing CF templates for this environment.
    Value: !Ref 'S3SourceBucket'
    Export:
      Name: !Sub '${AWS::StackName}-S3SourceBucket'
  CRHelperLambdaLayer:
    Value: !GetAtt 'LambdaCoreStack.Outputs.CRHelperLambdaLayer'
    Description: Reference to the Custom Resource Helper Lambda Layer
    Export:
      Name: !Sub '${AWS::StackName}-CRHelperLambdaLayer'
  BsWebApiApplicationName:
    Value: !GetAtt 'WebApiBeanstalkStack.Outputs.ApplicationName'
    Description: Beanstalk WebApi Application Name
    Export:
      Name: !Sub '${AWS::StackName}-BsWebApiApplicationName'
  BsWebApiEnvironmentName:
    Value: !GetAtt 'WebApiBeanstalkStack.Outputs.EnvironmentName'
    Description: Beanstalk WebApi Environment Name
    Export:
      Name: !Sub '${AWS::StackName}-BsWebApiEnvironmentName'
  SwaggerURL:
    Description: The URL for swagger
    Value:  !Sub 'swagger-ui.${DomainName}'